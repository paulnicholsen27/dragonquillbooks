<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Content Manager</title>
    <style>
        /* Center login logo and add spacing below it */

        [class*="css-17w9t8f-CustomIconWrapper"] {
            display: block;
            margin: 0 auto 30px auto;
			width: auto !important;
        }
    </style>
</head>
<body>
    <script src="https://unpkg.com/decap-cms@^3/dist/decap-cms.js"></script>

    <!-- Decap CMS preview pane script -->
    <!-- Edit this script to customize the preview pane for your blog posts.  -->
    <!-- Documentation: https://decapcms.org/docs/customization/ -->
    <script>
        const BlogPreview = ({ entry, widgetFor, getAsset }) => {
            const data = entry.get("data").toJS();
            const { title, author, date: rawDate, image } = data;
            const date = typeof rawDate === "string" ? new Date(rawDate) : rawDate;
            let formattedDate = "";
            if (date) {
                formattedDate = Intl.DateTimeFormat("en-US", {
                    month: "long",
                    day: "numeric",
                    year: "numeric"
                }).format(date);
            }

            const cover = getAsset(image);

            // Use h() from Decap CMS's bundled React
            const h = window.CMS.h;
            return h('div', { className: 'blog' },
                h('h1', { className: 'title' }, title),
                h('div', { className: 'metadata' },
                    h('span', { className: 'author' }, author),
                    h('span', { className: 'dot' }),
                    h('span', { className: 'date' }, formattedDate)
                ),
                h('img', { src: cover?.toString(), className: 'cover', alt: 'Cover' }),
                h('hr', { className: 'divider' }),
                h('div', { className: 'markdown' }, widgetFor('body'))
            );
        };

        // Register the elements and styles for the "blog" collection
        CMS.registerPreviewTemplate("blog", BlogPreview);
        CMS.registerPreviewStyle("/admin/decap-preview-styles.css");

        // Auto-populate author fields from logged-in user on new entries
        CMS.registerEventListener({
            name: 'preSave',
            handler: async ({ entry }) => {
                let data = entry.get('data');

                // Try to get user from CMS (works with DecapBridge PKCE)
                let user;
                try {
                    user = await CMS.getUser?.();
                } catch (e) {
                    user = null;
                }

                // Fallback to checking Netlify Identity
                if (!user) {
                    user = window.netlifyIdentity?.currentUser?.();
                }

                if (user) {
                    // Set author name if empty
                    if (!data.get('author')) {
                        const name = user.name || user.full_name ||
                            (user.first_name && user.last_name
                                ? `${user.first_name} ${user.last_name}`
                                : user.email);
                        if (name) {
                            data = data.set('author', name);
                        }
                    }

                    // Set avatar if empty
                    if (!data.get('authorAvatar') && user.avatar_url) {
                        data = data.set('authorAvatar', user.avatar_url);
                    }
                }

                return data;
            },
        });
    </script>
</body>

</html>
