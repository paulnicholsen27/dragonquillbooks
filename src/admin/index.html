<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Content Manager</title>
    <style>
        /* Center login logo and add spacing below it */

        [class*="css-17w9t8f-CustomIconWrapper"] {
            display: block;
            margin: 0 auto 30px auto;
			width: auto !important;
        }
    </style>
</head>
<body>
    <script src="https://unpkg.com/decap-cms@^3/dist/decap-cms.js"></script>

    <!-- Decap CMS preview pane script -->
    <!-- Edit this script to customize the preview pane for your blog posts.  -->
    <!-- Documentation: https://decapcms.org/docs/customization/ -->
    <script>
        // Just register the preview styles - use default preview template
        CMS.registerPreviewStyle("/admin/decap-preview-styles.css");

        // Auto-populate fields on save
        CMS.registerEventListener({
            name: 'preSave',
            handler: async ({ entry, author }) => {
                let data = entry.get('data');
                const slug = entry.get('slug'); // Current entry's file slug
                const title = data.get('title');

                // Generate URL slug from title
                const urlSlug = title
                    .toLowerCase()
                    .replace(/[^a-z0-9]+/g, '-')
                    .replace(/^-|-$/g, '');

                // Check if this slug already exists (for new entries or title changes)
                if (!data.get('url') || data.get('url') !== urlSlug) {
                    try {
                        // Try to fetch the blog URL to see if it exists
                        const response = await fetch(`/blog/${urlSlug}/`, { method: 'HEAD' });
                        if (response.ok) {
                            throw new Error(`A blog post with the URL "${urlSlug}" already exists. Please use a different title.`);
                        }
                    } catch (e) {
                        // If it's our error, rethrow it
                        if (e.message.includes('already exists')) {
                            throw e;
                        }
                        // Otherwise, 404 means slug is available - continue
                    }
                    data = data.set('url', urlSlug);
                }

                // Try to get user from CMS (works with DecapBridge PKCE)
                let user;
                try {
                    user = await CMS.getUser?.();
                } catch (e) {
                    user = null;
                }

                // Fallback to checking Netlify Identity
                if (!user) {
                    user = window.netlifyIdentity?.currentUser?.();
                }

                if (user) {
                    // Set author name if empty
                    if (!data.get('author')) {
                        const name = user.name || user.full_name ||
                            (user.first_name && user.last_name
                                ? `${user.first_name} ${user.last_name}`
                                : user.email);
                        if (name) {
                            data = data.set('author', name);
                        }
                    }

                    // Set avatar if empty
                    if (!data.get('authorAvatar') && user.avatar_url) {
                        data = data.set('authorAvatar', user.avatar_url);
                    }
                }

                return data;
            },
        });
    </script>
</body>

</html>
