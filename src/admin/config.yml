# yaml-language-server: $schema=
# Use DecapBridge PKCE auth (required)
backend:
  name: git-gateway
  repo: paulnicholsen27/dragonquillbooks
  branch: main
  auth_type: pkce
  base_url: https://auth.decapbridge.com
  auth_endpoint: /sites/81086a21-a8f5-44b1-9235-128a163cfc31/pkce
  auth_token_endpoint: /sites/81086a21-a8f5-44b1-9235-128a163cfc31/token
  gateway_url: https://gateway.decapbridge.com

  # See who did what (optional)
  commit_messages:
    create: Create {{collection}} “{{slug}}” - {{author-name}} <{{author-login}}> via DecapBridge
    update: Update {{collection}} “{{slug}}” - {{author-name}} <{{author-login}}> via DecapBridge
    delete: Delete {{collection}} “{{slug}}” - {{author-name}} <{{author-login}}> via DecapBridge
    uploadMedia: Upload “{{path}}” - {{author-name}} <{{author-login}}> via DecapBridge
    deleteMedia: Delete “{{path}}” - {{author-name}} <{{author-login}}> via DecapBridge
    openAuthoring: Message {{message}} - {{author-name}} <{{author-login}}> via DecapBridge

# Enable PKCE fields (optional, recommended)
auth:
  email_claim: email
  first_name_claim: first_name
  last_name_claim: last_name
  avatar_url_claim: avatar_url

logo_url: https://dragonquillbooks.netlify.app/assets/images/logo-horizontal-620925ce.avif

# Add site links in Decap CMS (optional)
site_url: https://dragonquillbooks.netlify.app

# # Keep this to allow you to edit the cms locally
# local_backend: true

# Image folders
media_folder: "src/assets/images/blog"
public_folder: "/assets/images/blog"

# Decap CMS Collections
collections:
    - name: "blog"
      label: "Blog"
      folder: "src/content/blog"
      create: true
      slug: "{{slug}}"
      fields:
          - { label: "Title", name: "title", widget: "string" }
          - { label: "Description", name: "description", widget: "string" }
          - { label: "Featured Post", name: "featured", widget: "boolean", default: false, hint: "Toggle on to display this post in the featured section" }
          - { label: "Date", name: "date", widget: "datetime" }
          - { label: "Featured Image", name: "image", widget: "image" }
          - { label: "Image Caption", name: "imageCaption", widget: "string", required: false, hint: "Optional caption for the featured image" }
          - { label: "Image Alt Text", name: "imageAlt", widget: "string", hint: "Alt text for the featured image to be read by assistive screen readers" }
          - { label: "Body", name: "body", widget: "markdown" }
